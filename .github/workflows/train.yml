name: Train on push to main

on:
  push:
    branches: [main]

# Avoid overlapping training runs from rapid-fire pushes. We do NOT cancel an
# in-flight run, because a long-running training process is already detached
# from the SSH session and cancelling the workflow won't kill it anyway.
concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger-training:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and trigger training
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TRAIN_HOST }}
          username: ${{ secrets.TRAIN_USER }}
          key: ${{ secrets.TRAIN_SSH_KEY }}
          script: |
            set -e
            cd ~/LoraCI

            # Sync first so we run the latest run_training.sh below. If this
            # fails the workflow turns red on GitHub Actions; it is not
            # covered by SMTP because notify_email.py may not exist yet on
            # the very first deploy.
            git fetch origin main
            git reset --hard origin/main

            export SMTP_HOST="${{ secrets.SMTP_HOST }}"
            export SMTP_PORT="${{ secrets.SMTP_PORT }}"
            export SMTP_USER="${{ secrets.SMTP_USER }}"
            export SMTP_PASS="${{ secrets.SMTP_PASS }}"
            export NOTIFY_EMAIL="${{ secrets.NOTIFY_EMAIL }}"

            bash scripts/run_training.sh
